services:
  postgres:
    image: postgres:16-alpine
    container_name: caseprep-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caseprep}
      POSTGRES_USER: ${POSTGRES_USER:-caseprep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseprep}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caseprep} -d ${POSTGRES_DB:-caseprep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caseprep-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caseprep-api
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_DEBUG: ${APP_DEBUG:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caseprep-worker
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_DEBUG: ${APP_DEBUG:-false}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: python -m app.workers.document_worker
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck_worker.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: caseprep-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    profiles: ["tools"]
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: alembic upgrade head

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    profiles: ["tools"]
    volumes:
      - backend_storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
    command: python scripts/seed.py

  test-e2e:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    profiles: ["tools"]
    volumes:
      - backend_storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pytest tests/e2e -q

volumes:
  postgres_data:
  redis_data:
  backend_storage:
