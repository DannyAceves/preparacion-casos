[project]
name = "legal-case-prep-backend"
version = "0.1.0"
description = "Backend base for legal and immigration case preparation workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "alembic>=1.16.0,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "redis>=6.0.0,<7.0.0",
    "pypdf>=5.4.0,<6.0.0",
    "Pillow>=11.2.0,<12.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
